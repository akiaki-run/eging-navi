name: 潮位表の更新

on:
  schedule:
    - cron: "17 18 1 * *"   # 毎月2日 3:17(日本時間)
  workflow_dispatch:         # Actions の画面から手動でも動かせる

permissions:
  contents: write

jobs:
  tide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 気象庁の潮位表を取り込む
        run: python scripts/fetch_tide.py
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tide
          git diff --cached --quiet || git commit -m "潮位表を更新"
          git push
